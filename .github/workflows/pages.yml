name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes supersede in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Build the real React frontend in demo mode: the /api/* calls are
      # mocked in the browser (src/demo/mockApi.ts) since Pages is static.
      - name: Build demo frontend
        working-directory: frontend
        env:
          VITE_DEMO_MODE: "true"
        run: |
          npm ci
          npm run build -- --base=/${{ github.event.repository.name }}/demo/

      # Portfolio landing page at /, interactive demo at /demo/.
      - name: Stage site
        run: |
          mkdir -p _site/demo
          cp -R site/. _site/
          cp -R frontend/dist/. _site/demo/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
