services:
  backend:
    build:
      context: ./backend
    environment:
      PORT: 3000
      WHISPER_MODEL: ${WHISPER_MODEL:-base.en}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_MODEL: ${LLM_MODEL:-gemma3:4b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/api/status')",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - app-network
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - backend-cache:/home/appuser/.cache

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_UPSTREAM: backend:3000
    networks:
      - app-network
    ports:
      - "80:80"
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  backend-cache:
